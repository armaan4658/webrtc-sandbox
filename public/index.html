<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>WebRTC SFU Simulcast Sandbox</title>
  <style>
    body { font-family: sans-serif; background: #121212; color: #fff; text-align: center; }
    .video-grid { display: flex; justify-content: center; gap: 20px; margin-top: 20px; }
    video { width: 400px; height: 300px; background: #000; border-radius: 8px; border: 2px solid #333; }
    .controls { margin-top: 20px; }
    button { padding: 10px 18px; margin: 5px; font-weight: bold; cursor: pointer; border-radius: 4px; }
  </style>
</head>
<body>
  <h2>WebRTC SFU Simulcast Sandbox</h2>
  <div class="video-grid">
    <div>
      <h3>Publisher (Local Media)</h3>
      <video id="localVideo" autoplay playsinline muted></video>
    </div>
    <div>
      <h3>Subscriber (SFU Stream)</h3>
      <video id="remoteVideo" autoplay playsinline></video>
    </div>
  </div>

  <div class="controls">
    <button onclick="publish()">1. Publish (Simulcast)</button>
    <button onclick="subscribe()">2. Subscribe</button>
    <hr style="width: 50%; margin: 20px auto; border-color: #333;">
    <p>Simulate Network / Force Spatial Layer Switching:</p>
    <button onclick="setLayer(2)" style="background: #2e7d32; color: white;">High Layer (720p)</button>
    <button onclick="setLayer(1)" style="background: #f57f17; color: white;">Mid Layer (360p)</button>
    <button onclick="setLayer(0)" style="background: #c62828; color: white;">Low Layer (180p)</button>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="https://bundle.run/mediasoup-client@3.6.81"></script>
  <script>
    const socket = io();
    let device;
    let producerTransport;
    let consumerTransport;

    // Encapsulate Simulcast Layers (High, Mid, Low)
    const encodings = [
      { rid: 'r0', maxBitrate: 100000, scaleResolutionDownBy: 4.0 }, // Low
      { rid: 'r1', maxBitrate: 300000, scaleResolutionDownBy: 2.0 }, // Mid
      { rid: 'r2', maxBitrate: 900000, scaleResolutionDownBy: 1.0 }, // High
    ];

    async function publish() {
      const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720 } });
      document.getElementById('localVideo').srcObject = stream;
      const track = stream.getVideoTracks()[0];

      socket.emit('getRtpCapabilities', async (routerRtpCapabilities) => {
        device = new mediasoupClient.Device();
        await device.load({ routerRtpCapabilities });

        socket.emit('createWebRtcTransport', { sender: true }, async (params) => {
          producerTransport = device.createSendTransport(params);

          producerTransport.on('connect', async ({ dtlsParameters }, callback, errback) => {
            socket.emit('connectTransport', { transportId: producerTransport.id, dtlsParameters });
            callback();
          });

          producerTransport.on('produce', async ({ kind, rtpParameters }, callback, errback) => {
            socket.emit('produce', { kind, rtpParameters }, ({ id }) => callback({ id }));
          });

          await producerTransport.produce({ track, encodings, codecOptions: { videoGoogleStartBitrate: 1000 } });
          console.log('Publishing with Simulcast enabled!');
        });
      });
    }

    async function subscribe() {
      socket.emit('createWebRtcTransport', { sender: false }, async (params) => {
        consumerTransport = device.createRecvTransport(params);

        consumerTransport.on('connect', async ({ dtlsParameters }, callback, errback) => {
          socket.emit('connectTransport', { transportId: consumerTransport.id, dtlsParameters });
          callback();
        });

        socket.emit('consume', { rtpCapabilities: device.rtpCapabilities }, async (consumerParams) => {
          const consumer = await consumerTransport.consume(consumerParams);
          const { track } = consumer;
          document.getElementById('remoteVideo').srcObject = new MediaStream([track]);
        });
      });
    }

    function setLayer(spatialLayer) {
      socket.emit('setPreferredLayers', { spatialLayer });
    }
  </script>
</body>
</html>
